name: SignalK Plugin CI

# Cross-platform plugin test via SignalK's reusable workflow (Linux x64/arm64,
# macOS, Windows, armv7/Venus OS). Running it earns the registry's plugin-ci
# credit (worth +10 on the 0-100 score; its absence is a flat -10 penalty).
#
# Pinned to a signalk-server RELEASE COMMIT, not @master, for supply-chain
# safety and reproducibility. The signalk-registry skill flags when this pin
# falls behind the latest signalk-server release.
# The registry samples a run on `refs/heads/main` (see plugin_ci.workflow_ref in
# https://signalk.org/signalk-plugin-registry/plugins/<slug>.json), so main is the
# only branch whose runs feed the score. Running on every branch push as well as
# every PR ran the whole 9-job matrix TWICE per commit and earned nothing.
on:
  push:
    branches: [main]
  pull_request:

# Never cancel a main run — that is the one the registry reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin-ci:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@67249e0e0fdcf7f9b0298bfada4cec32ea581a38 # v2.30.0
